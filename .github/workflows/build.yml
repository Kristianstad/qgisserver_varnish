name: Build QGIS Server with Varnish

on:
  push:
    branches: [main]
    tags: ['*']
    paths-ignore:
      - README.md
      - docker-compose.yml
  pull_request:
    paths-ignore:
      - README.md
      - docker-compose.yml
  workflow_dispatch:
    inputs:
      qgis_version:
        description: QGIS Server version (for example 3.44.15)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            qgis_suffix: ''
          - variant: slim
            qgis_suffix: '-slim'
          - variant: ultra-slim
            qgis_suffix: '-ultra-slim'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read QGIS version
        id: qgis
        env:
          INPUT_VERSION: ${{ inputs.qgis_version }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG QGIS_SERVER_VERSION=//p' Dockerfile | head -n 1)"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid QGIS version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify QGIS Server base image is published
        run: |
          base=ghcr.io/kristianstad/qgisserver:${{ steps.qgis.outputs.version }}${{ matrix.qgis_suffix }}
          docker pull -q "$base"

      - name: Create image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'standard' }}
            type=raw,value=${{ steps.qgis.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'standard' }}
            type=raw,value=slim,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'slim' }}
            type=raw,value=${{ steps.qgis.outputs.version }}-slim,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'slim' }}
            type=raw,value=ultra-slim,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'ultra-slim' }}
            type=raw,value=${{ steps.qgis.outputs.version }}-ultra-slim,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'ultra-slim' }}
            type=sha,enable=${{ matrix.variant == 'standard' }}
            type=sha,suffix=-slim,enable=${{ matrix.variant == 'slim' }}
            type=sha,suffix=-ultra-slim,enable=${{ matrix.variant == 'ultra-slim' }}
            type=ref,event=tag,enable=${{ matrix.variant == 'standard' }}
            type=ref,event=tag,suffix=-slim,enable=${{ matrix.variant == 'slim' }}
            type=ref,event=tag,suffix=-ultra-slim,enable=${{ matrix.variant == 'ultra-slim' }}
          labels: |
            org.opencontainers.image.licenses=NOASSERTION

      - name: Build image for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          load: true
          push: false
          tags: qgis-varnish:test-${{ matrix.variant }}
          build-args: |
            QGIS_SERVER_VERSION=${{ steps.qgis.outputs.version }}
            QGIS_SERVER_BASE=ghcr.io/kristianstad/qgisserver:${{ steps.qgis.outputs.version }}${{ matrix.qgis_suffix }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
          provenance: false

      - name: Start QGIS Server and Varnish
        run: |
          chmod -R a+rX tests/smoke
          docker run -d --name smoke -p 18082:8080 \
            -v "$PWD/tests/smoke:/qgis-data:ro" \
            -e VARNISH_ADMIN_USER=admin \
            -e VARNISH_ADMIN_PASSWORD=testlosenord123 \
            qgis-varnish:test-${{ matrix.variant }}
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::Container exited during startup"
              exit 1
            fi
            if docker exec smoke curl -fs -o /dev/null http://127.0.0.1:8080/ping; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::QGIS Server did not answer /ping within 2 minutes"
          exit 1

      - name: Test Varnish and WMS endpoints
        run: |
          set -e
          code() { docker exec smoke curl -s -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(code -X BAN -H 'X-Ban-Project: test' http://127.0.0.1:8080/)" = 200 ]
          [ "$(code -X BAN -H 'X-Ban-Layer: test' http://127.0.0.1:8080/)" = 200 ]
          [ "$(code http://127.0.0.1:8080/_admin)" = 401 ]
          [ "$(code -u admin:testlosenord123 http://127.0.0.1:8080/_admin)" = 200 ]
          docker exec smoke test -f /usr/share/doc/qgis-varnish/LICENSE
          docker exec smoke test -u /usr/bin/Xvfb
          docker exec smoke env QT_QPA_PLATFORM=offscreen python3 -c "import qgis.core, qgis.server, numpy"

          docker run -d --name ref -p 18080:8080 \
            -v "$PWD/tests/smoke:/qgis-data:ro" \
            3liz/qgis-map-server:${{ steps.qgis.outputs.version }}
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:18080/ping && break
            sleep 2
          done
          curl -fs -o /dev/null http://127.0.0.1:18080/ping

          q="/ows/?MAP=smoke.qgs&SERVICE=WMS"
          map="&VERSION=1.1.1&REQUEST=GetMap&LAYERS=data&STYLES=&SRS=EPSG:3006&BBOX=300000,6100000,900000,6800000&WIDTH=400&HEIGHT=400&FORMAT=image/png"
          legend="&VERSION=1.3.0&REQUEST=GetLegendGraphic&LAYER=data&FORMAT=image/png"
          caps="&VERSION=1.3.0&REQUEST=GetCapabilities"
          fetch() {
            type=$(curl -sS -o "$3" -w '%{http_code} %{content_type}' "http://127.0.0.1:$1$q$2")
            case "$type" in
              "200 image/png"*) ;;
              "200 "*) if [ "${4:-}" = png ]; then echo "::error::Unexpected content type: $type"; exit 1; fi ;;
              *) echo "::error::HTTP result $type for $2"; cat "$3"; exit 1 ;;
            esac
          }
          hits() { docker exec smoke varnishstat -1 -f MAIN.cache_hit | awk '{print $2}'; }
          before=$(hits)
          for part in map legend; do
            fetch 18082 "${!part}" "new-$part.png" png
            fetch 18080 "${!part}" "ref-$part.png" png
            cmp "new-$part.png" "ref-$part.png"
          done
          [ "$(stat -c %s new-map.png)" -gt 2000 ]
          fetch 18082 "$map" again.png png
          [ "$(hits)" -gt "$before" ]
          fetch 18082 "$caps" new-caps.xml
          fetch 18080 "$caps" ref-caps.xml
          names() { grep -oE '<(Name|CRS)>[^<]*</(Name|CRS)>' "$1" | sort; }
          diff <(names new-caps.xml) <(names ref-caps.xml)
          grep -q '<Name>data</Name>' new-caps.xml

      - name: Verify inherited environment
        if: matrix.variant != 'standard'
        run: |
          base=ghcr.io/kristianstad/qgisserver:${{ steps.qgis.outputs.version }}${{ matrix.qgis_suffix }}
          docker pull -q "$base"
          env_of() { docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$1" | sort; }
          missing=$(comm -23 <(env_of "$base") <(env_of qgis-varnish:test-${{ matrix.variant }}))
          if [ -n "$missing" ]; then
            echo "::error::Missing base image environment values:"
            echo "$missing"
            exit 1
          fi

      - name: Show logs and clean up
        if: always()
        run: |
          docker logs smoke 2>&1 | tail -n 100 || true
          docker rm -f smoke ref >/dev/null 2>&1 || true

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QGIS_SERVER_VERSION=${{ steps.qgis.outputs.version }}
            QGIS_SERVER_BASE=ghcr.io/kristianstad/qgisserver:${{ steps.qgis.outputs.version }}${{ matrix.qgis_suffix }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          provenance: false
