# Bygger avbilden, testar att den startar och publicerar den på ghcr.io.
#
#   Pull request          -> bygger och testar (publicerar inte)
#   Push till main        -> bygger, testar och publicerar  :latest, :<QGIS-version>, :sha-<commit>
#   Push till slim / ultra-slim -> som main, men variantnamnet ingår i taggarna:
#                            :<variant>, :<QGIS-version>-<variant>, :sha-<commit>-<variant>
#   Git-tagg (t.ex. 3.44.14-r1) -> bygger, testar och publicerar  :<taggen>
#   Manuellt (Actions-fliken)   -> som push till grenen körningen startas på; valfri QGIS-version kan anges
name: Bygg avbild

on:
  push:
    branches: [main, slim, ultra-slim]
    tags: ['*']
    paths-ignore:
      - README.md
      - docker-compose.yml
  pull_request:
    paths-ignore:
      - README.md
      - docker-compose.yml
  workflow_dispatch:
    inputs:
      qgis_version:
        description: 'QGIS Server-version (t.ex. 3.44.15). Tomt = den som står i Dockerfile.'
        required: false
        default: ''

# Två körningar för samma gren/PR samtidigt: avbryt den äldre (bara för pull requests).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read      # hämta koden
      packages: write     # publicera på ghcr.io

    steps:
      - name: Hämta koden
        uses: actions/checkout@v6

      # QGIS-versionen står som ARG överst i Dockerfile och används även som avbildens versionstagg.
      - name: Ta reda på QGIS-version
        id: qgis
        env:
          INPUT_VERSION: ${{ inputs.qgis_version }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG QGIS_SERVER_VERSION=//p' Dockerfile | head -n 1)"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ogiltig QGIS-version: '$version' (förväntade t.ex. 3.44.14)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "QGIS Server-version: $version"

      - name: Förbered Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Bygger man från grenen slim eller ultra-slim ingår grenens namn i taggarna.
      - name: Ta reda på avbildsvariant
        id: variant
        run: |
          case "$GITHUB_REF" in
            refs/heads/slim)       echo "name=slim" >> "$GITHUB_OUTPUT" ;;
            refs/heads/ultra-slim) echo "name=ultra-slim" >> "$GITHUB_OUTPUT" ;;
            *)                     echo "name=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Skapa taggar och etiketter
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Utan variant: latest + versionen på standardgrenen. Med variant: variantnamnet och versionen med
          # variantnamn som suffix. Taggar med tomt värde ("none") är avstängda via enable.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.qgis.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.variant.outputs.name || 'none' }},enable=${{ steps.variant.outputs.name != '' }}
            type=raw,value=${{ steps.qgis.outputs.version }}-${{ steps.variant.outputs.name || 'none' }},enable=${{ steps.variant.outputs.name != '' }}
            type=sha,enable=${{ steps.variant.outputs.name == '' }}
            type=sha,suffix=-${{ steps.variant.outputs.name || 'none' }},enable=${{ steps.variant.outputs.name != '' }}
            type=ref,event=tag
          # Avbilden innehåller mer än våra egna filer (QGIS, Varnish, Ubuntu-paket m.m.).
          # Därför anger vi inte BSD-2-Clause som licens för hela avbilden.
          labels: |
            org.opencontainers.image.licenses=NOASSERTION

      # Steg 1: bygg för att kunna testa (laddas in i den lokala Docker-motorn, publiceras inte).
      - name: Bygg avbilden för test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: qgis-varnish:test
          build-args: |
            QGIS_SERVER_VERSION=${{ steps.qgis.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Samma bygge utan utplattning (bara steget "build"), som jämförelse för storlekskontrollen.
      - name: Bygg lagerversionen för storleksjämförelse
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          load: true
          push: false
          tags: qgis-varnish:layered
          build-args: |
            QGIS_SERVER_VERSION=${{ steps.qgis.outputs.version }}
          cache-from: type=gha
          provenance: false

      - name: Röktest - starta containern
        run: |
          # Testprojektet ska kunna läsas av QGIS Server-användaren (uid 9001).
          chmod -R a+rX tests/smoke
          docker run -d --name smoke -p 8080:8080 \
            -v "$PWD/tests/smoke:/qgis-data:ro" \
            -e VARNISH_ADMIN_USER=admin \
            -e VARNISH_ADMIN_PASSWORD=testlosenord123 \
            qgis-varnish:test

          ok=0
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::Containern avslutades under starten"
              exit 1
            fi
            if docker exec smoke curl -fs -o /dev/null http://127.0.0.1:8080/ping; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Containern svarade inte på /ping inom 2 minuter"
            exit 1
          fi
          echo "Containern svarar på /ping"

      - name: Röktest - kontrollera funktionerna
        run: |
          set -e
          code() { docker exec smoke curl -s -o /dev/null -w '%{http_code}' "$@"; }

          echo "Varnish: $(docker exec smoke varnishd -V 2>&1 | head -n 1)"

          [ "$(code -X BAN -H 'X-Ban-Project: test' http://127.0.0.1:8080/)" = "200" ] \
            || { echo "::error::BAN av projekt fungerar inte"; exit 1; }
          [ "$(code -X BAN -H 'X-Ban-Layer: test' http://127.0.0.1:8080/)" = "200" ] \
            || { echo "::error::BAN av lager fungerar inte"; exit 1; }
          [ "$(code http://127.0.0.1:8080/_admin)" = "401" ] \
            || { echo "::error::Adminsidan kräver inte inloggning"; exit 1; }
          [ "$(code -u admin:testlosenord123 http://127.0.0.1:8080/_admin)" = "200" ] \
            || { echo "::error::Adminsidan går inte att logga in på"; exit 1; }
          docker exec smoke test -f /usr/share/doc/qgis-varnish/LICENSE \
            || { echo "::error::LICENSE saknas i avbilden"; exit 1; }
          docker exec smoke test -u /usr/bin/Xvfb \
            || { echo "::error::Xvfb har tappat setuid-biten"; exit 1; }
          docker exec smoke env QT_QPA_PLATFORM=offscreen python3 -c "import qgis.core, qgis.server, numpy" \
            || { echo "::error::QGIS Python-moduler kan inte importeras"; exit 1; }
          echo "Alla röktester godkända"

      # Avbilden är utplattad, så basavbildens ENV följer inte med automatiskt: kontrollera att inget saknas.
      - name: Kontrollera att basavbildens miljövariabler finns kvar
        run: |
          base=3liz/qgis-map-server:${{ steps.qgis.outputs.version }}
          docker pull -q "$base"
          env_of() { docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$1" | sort; }
          missing=$(comm -23 <(env_of "$base") <(env_of qgis-varnish:test))
          if [ -n "$missing" ]; then
            echo "::error::Dessa ENV från basavbilden saknas i Dockerfile (slutsteget):"
            echo "$missing"
            exit 1
          fi

      # Samma anrop mot den orörda basavbilden och mot vår avbild (via Varnish) ska ge samma bild.
      - name: Röktest - rendera testprojektet och jämför med basavbilden
        run: |
          set -e
          docker run -d --name ref -p 18080:8080 \
            -v "$PWD/tests/smoke:/qgis-data:ro" \
            3liz/qgis-map-server:${{ steps.qgis.outputs.version }}
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:18080/ping && break
            sleep 2
          done
          curl -fs -o /dev/null http://127.0.0.1:18080/ping \
            || { echo "::error::Basavbilden svarade inte"; exit 1; }

          q="/ows/?MAP=smoke.qgs&SERVICE=WMS"
          map="&VERSION=1.1.1&REQUEST=GetMap&LAYERS=data&STYLES=&SRS=EPSG:3006&BBOX=300000,6100000,900000,6800000&WIDTH=400&HEIGHT=400&FORMAT=image/png"
          legend="&VERSION=1.3.0&REQUEST=GetLegendGraphic&LAYER=data&FORMAT=image/png"
          caps="&VERSION=1.3.0&REQUEST=GetCapabilities"

          # fetch <port> <fråga> <fil> [png]: hämtar och kontrollerar status (och PNG-typ).
          fetch() {
            type=$(curl -sS -o "$3" -w '%{http_code} %{content_type}' "http://127.0.0.1:$1$q$2")
            case "$type" in
              "200 image/png"*) ;;
              "200 "*)
                if [ "${4:-}" = png ]; then echo "::error::Fel typ ($type) för $2"; exit 1; fi ;;
              *) echo "::error::$type för $2"; cat "$3"; exit 1 ;;
            esac
          }
          hits() { docker exec smoke varnishstat -1 -f MAIN.cache_hit | awk '{print $2}'; }

          before=$(hits)
          for part in map legend; do
            fetch 8080 "${!part}" "new-$part.png" png
            fetch 18080 "${!part}" "ref-$part.png" png
            cmp "new-$part.png" "ref-$part.png" \
              || { echo "::error::$part skiljer sig från basavbildens svar"; exit 1; }
          done
          # Bilden ska inte vara tom: en tom 400x400-bild blir mycket liten.
          [ "$(stat -c %s new-map.png)" -gt 2000 ] \
            || { echo "::error::GetMap gav en (nästan) tom bild"; exit 1; }

          # Andra anropet ska komma från Varnish-cachen.
          fetch 8080 "$map" again.png png
          [ "$(hits)" -gt "$before" ] \
            || { echo "::error::Andra GetMap kom inte från cachen"; exit 1; }

          # GetCapabilities: attributens ordning i XML:en varierar mellan körningar, så jämför lager och CRS.
          fetch 8080 "$caps" new-caps.xml
          fetch 18080 "$caps" ref-caps.xml
          names() { grep -oE '<(Name|CRS)>[^<]*</(Name|CRS)>' "$1" | sort; }
          diff <(names new-caps.xml) <(names ref-caps.xml) \
            || { echo "::error::GetCapabilities skiljer sig från basavbildens"; exit 1; }
          grep -q '<Name>data</Name>' new-caps.xml \
            || { echo "::error::Lagret saknas i GetCapabilities"; exit 1; }
          echo "Testprojektet renderas likadant som i basavbilden"

      # Utplattningen ska göra avbilden märkbart mindre än samma bygge i lager (komprimerad storlek, som vid hämtning).
      - name: Kontrollera avbildens storlek
        run: |
          size() { docker save "$1" | gzip -6 | wc -c; }
          layered=$(size qgis-varnish:layered)
          flat=$(size qgis-varnish:test)
          mb() { echo $(( $1 / 1048576 )); }
          {
            echo "### Komprimerad avbildsstorlek"
            echo "| Avbild | MiB |"
            echo "|---|---|"
            echo "| I lager (utan utplattning) | $(mb "$layered") |"
            echo "| Utplattad (publiceras) | $(mb "$flat") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Kräv minst 10 % minskning.
          [ $(( flat * 10 )) -lt $(( layered * 9 )) ] \
            || { echo "::error::Utplattad avbild är inte minst 10 % mindre"; exit 1; }

      - name: Visa containerns logg
        if: always()
        run: |
          docker logs smoke 2>&1 | tail -n 100 || true
          docker rm -f smoke ref >/dev/null 2>&1 || true

      # Steg 2: publicera (bara vid push, tagg eller manuell körning - aldrig för pull requests).
      # Bygget använder cachen från steg 1, så det går snabbt.
      - name: Logga in på ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg och publicera
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QGIS_SERVER_VERSION=${{ steps.qgis.outputs.version }}
          cache-from: type=gha
          # Provenance/SBOM-attestering av: ger en enkel avbild utan extra manifest
          # (kompatibelt med Docker Swarm och äldre verktyg).
          provenance: false
